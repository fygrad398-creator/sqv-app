[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqv-descuentos"
version = "1.2.0"
description = "Simulador reproducible de descuentos para productos proximos a vencer."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "matplotlib>=3.7", "PyYAML>=6.0", "openpyxl>=3.1", "pyarrow>=15.0", "streamlit>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
